name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Add .nojekyll for GitHub Pages
        run: touch out/.nojekyll

      - name: Verify build output
        run: |
          echo "Checking if out directory exists..."
          ls -la
          if [ -d "out" ]; then
            echo "✓ out directory exists"
            ls -la out/ | head -20
          else
            echo "✗ out directory not found!"
            exit 1
          fi

      # The repo's Pages source is "deploy from a branch", so every push also
      # kicks off the built-in Jekyll builder, which races this workflow and
      # publishes the README if it finishes last. configure-pages only creates
      # a Pages site when none exists, so it can't convert an existing one --
      # flip the source to Actions explicitly. Non-fatal: a failure here still
      # lets the deploy proceed, it just leaves the race in place.
      - name: Build Pages from Actions, not the branch
        run: |
          if curl -sS -f -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}'; then
            echo "Pages source set to GitHub Actions."
          else
            echo "::warning::Could not set the Pages source to GitHub Actions."
            echo "::warning::Set it by hand under Settings > Pages > Source, or the"
            echo "::warning::built-in Jekyll build may overwrite this deployment."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 